[project]
name = "predicting-market-reactions-news"
version = "0.1.0"
description = "Replication code for Predicting Market Reactions to News: An LLM-Based Approach Using Spanish Business Articles"
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.4.3,<2.0.0",
    "numpy>=1.22.4,<2.0.0",
    "matplotlib>=3.5.2,<4.0.0",
    "seaborn>=0.11.2,<0.14.0",
    "scikit-learn>=1.1.1,<2.0.0",
    "scipy>=1.8.1,<2.0.0",
    "yfinance>=0.1.70,<1.0.0",
    "statsmodels>=0.13.2,<1.0.0",
    "nltk>=3.7,<4.0.0",
    "wordcloud>=1.8.1,<2.0.0",
    "Pillow>=9.1.1,<11.0.0",
    "joblib>=1.1.0,<2.0.0",
    "torch>=1.11.0,<3.0.0",
    "sentence-transformers>=2.2.2,<3.0.0",
    "sklearn-extra>=0.2.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "colorama>=0.4.6,<1.0.0",
    "groq>=0.4.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

